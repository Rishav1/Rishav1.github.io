# Staleness watchdog for _data/citations.yml.
#
# This does NOT update citations. Google Scholar serves a "not a robot" wall
# to GitHub's runner IP ranges on every attempt, while the identical request
# succeeds in about a second from a home network, so the refresh runs locally
# instead -- see bin/refresh_citations.sh and bin/install_citation_schedule.sh.
#
# What this job does is notice when that local schedule stops working. The
# script keeps the existing data when Scholar blocks it and exits 0 while the
# data is under 10 days old, so this stays quiet as long as the local job is
# running, and fails once the counts have gone genuinely stale.
name: Check Google Scholar citation freshness

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:
    inputs:
      force:
        description: "Refetch even if citations.yml was already updated today"
        type: boolean
        default: false

jobs:
  check-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          # The script reads the Scholar profile page with the standard
          # library alone, so pyyaml is the only dependency. Installing the
          # full requirements.txt would drag in rendercv[full]/nbconvert,
          # which this job never uses and which dominated its runtime.
          pip install pyyaml

      - name: Check citation freshness
        shell: bash
        run: |
          set +e
          echo "🚀 Checking citation freshness..."
          # The script retries internally and caps its own runtime well under
          # this; the timeout only guards against a hung socket.
          timeout -k 10 300 python bin/update_scholar_citations.py ${{ inputs.force && '--force' || '' }}
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "✅ Citations are current." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ $status -eq 124 ] || [ $status -eq 137 ]; then
            reason="timed out after 300s"
          else
            reason="exited with code $status"
          fi
          # Reaching here means the data is genuinely stale, not merely that
          # Scholar blocked this run. Do NOT swallow it: swallowing the
          # failure is exactly what hid the previous two-week outage.
          echo "::error title=Citations are stale::Script $reason. Check that the local schedule is still running: bin/install_citation_schedule.sh --status"
          echo "❌ Citations are stale ($reason)." >> $GITHUB_STEP_SUMMARY
          echo "The local refresh may have stopped. Check with \`bin/install_citation_schedule.sh --status\`." >> $GITHUB_STEP_SUMMARY
          exit 1
